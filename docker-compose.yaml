version: "3.9"

services:

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongodb:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - roboshop

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis:/data
    networks:
      - roboshop

  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    networks:
      - roboshop

  mysql:
    image: mysql:8
    container_name: mysql
    restart: unless-stopped
    command:
      - --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: RoboShop@1
      MYSQL_DATABASE: cities
    volumes:
      - mysql:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - roboshop

  catalogue:
    build:
      context: ./catalogue
    image: catalogue:v1
    container_name: catalogue
    depends_on:
      - mongodb
    networks:
      - roboshop

  user:
    build:
      context: ./user
    image: user:v1
    container_name: user
    environment:
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongodb:27017/users
    depends_on:
      - mongodb
      - redis
    networks:
      - roboshop

  cart:
    build:
      context: ./cart
    image: cart:v1
    container_name: cart
    depends_on:
      - redis
      - catalogue
    networks:
      - roboshop

  shipping:
    build:
      context: ./shipping
    image: shipping:v1
    container_name: shipping
    environment:
      DB_HOST: mysql
      CART_ENDPOINT: cart:8080
    depends_on:
      - mysql
      - cart
    networks:
      - roboshop

  payment:
    build:
      context: ./payment
    image: payment:v1
    container_name: payment
    environment:
      CART_HOST: cart
      CART_PORT: 8080
      USER_HOST: user
      USER_PORT: 8080
      AMQP_HOST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123
    depends_on:
      - rabbitmq
      - cart
      - user
    networks:
      - roboshop

  frontend:
    build:
      context: ./frontend
    image: frontend:v1
    container_name: frontend
    ports:
      - "8080:80"
    depends_on:
      - catalogue
      - user
      - cart
      - shipping
      - payment
    networks:
      - roboshop

networks:
  roboshop:
    driver: bridge

volumes:
  mongodb:
  redis:
  rabbitmq:
  mysql: